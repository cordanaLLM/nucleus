---
# actionlint rejects a runs-on label that is missing from its built-in table of
# GitHub-hosted runners unless the label is declared here. actionlint v1.7.12 does
# not know the label below, which licence.yml runs on. Delete a label once
# actionlint accepts .github/workflows without it.
self-hosted-runner:
  labels:
    - ubuntu-26.04

# actionlint v1.7.12 does not know the documented concurrency key `queue` (upstream issue
# rhysd/actionlint#657). Ignored only for that message, only in the workflows that use it;
# delete once actionlint accepts it.
paths:
  "**/.github/workflows/{build-matrix,nvidia-open-module,openzfs-module,package-lifecycle,verify-requirements,release-build,security-scans}.yml":
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
