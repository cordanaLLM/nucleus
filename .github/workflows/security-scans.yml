---
name: security-scans
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "13 5 * * 1"

permissions:
  contents: read

concurrency:
  group: security-scans-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Security Scan Paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            code:
              - 'kconfig/**'
              - 'scripts/**'
              - 'patches/**'
              - 'tests/**'
              - 'versions.json'
              - 'versions.schema.json'
              - 'Makefile'
              - 'pyproject.toml'
              - '.github/**'

  semgrep:
    name: Semgrep SAST
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'schedule' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: pip install --no-cache-dir semgrep
      - name: Run Semgrep Security Rules
        run: |
          semgrep --error --config p/ci --config p/security-audit .

  trivy:
    name: Trivy Filesystem CVE Scan
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'schedule' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "table"
          severity: "CRITICAL,HIGH"

  gitleaks:
    name: Gitleaks History Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # gitleaks-action requires a paid license for organization-owned repositories;
      # the CLI does not. Pinned release, verified against the published checksums.
      - name: Run Gitleaks CLI against full history
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --max-time 120 --retry 3 -o "/tmp/${archive}" "${base}/${archive}"
          curl -sSfL --max-time 60 --retry 3 -o /tmp/gitleaks_checksums.txt \
            "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd /tmp && grep " ${archive}$" gitleaks_checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner --exit-code 1 .
