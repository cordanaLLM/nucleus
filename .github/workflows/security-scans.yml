---
name: security-scans
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "13 5 * * 1"

permissions:
  contents: read

concurrency:
  group: security-scans-${{ github.ref }}
  # A new push to a pull request cancels its running run; a run for main is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Security Scan Paths
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'kconfig/**'
              - 'scripts/**'
              - 'patches/**'
              - 'tests/**'
              - 'versions.json'
              - 'versions.schema.json'
              - 'Makefile'
              - 'pyproject.toml'
              - '.github/**'

  semgrep:
    name: Semgrep SAST
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'schedule' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # One repository-wide queue per scanner: at most three scan jobs of nucleus run at once.
    concurrency:
      group: nucleus-scan-${{ github.job }}
      queue: max
      cancel-in-progress: false
    # Semgrep runs from its publisher's image, named by release and digest, so the scanner
    # changes only with a commit here. The update bot moves both parts together.
    container:
      image: semgrep/semgrep:1.182.1@sha256:451b3d875c00dac7ed5db5293e584a07de11449a409c10b3c2d2652f429630b6
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Semgrep Security Rules
        # The container default, named: the one command needs no bash features.
        shell: sh
        run: |
          semgrep --error --config p/ci --config p/security-audit .

  trivy:
    name: Trivy Filesystem CVE Scan
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'schedule' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # One repository-wide queue per scanner: at most three scan jobs of nucleus run at once.
    concurrency:
      group: nucleus-scan-${{ github.job }}
      queue: max
      cancel-in-progress: false
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "table"
          severity: "CRITICAL,HIGH"

  gitleaks:
    name: Gitleaks History Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One repository-wide queue per scanner: at most three scan jobs of nucleus run at once.
    concurrency:
      group: nucleus-scan-${{ github.job }}
      queue: max
      cancel-in-progress: false
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # gitleaks-action requires a paid license for organization-owned repositories;
      # the CLI does not. Pinned release, verified against repo-pinned digest.
      - name: Run Gitleaks CLI against full history
        run: |
          set -euo pipefail
          # renovate updates both lines (github-release-attachments).
          gitleaks_version=v8.30.1
          gitleaks_sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          archive="gitleaks_${gitleaks_version#v}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/${gitleaks_version}"
          curl -sSfL --max-time 120 --retry 3 -o "/tmp/${archive}" "${base}/${archive}"
          echo "${gitleaks_sha256}  /tmp/${archive}" | sha256sum -c
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner --exit-code 1 .

  # One check that stands for every scan above. Semgrep and Trivy are skipped on pull
  # requests that touch no code path, and GitHub reports a skipped job as successful, so
  # neither can be a required check on its own. This job needs all of them and runs on every
  # event that is not cancelled (if: !cancelled()): a run superseded by a newer push must not
  # hold a hosted runner slot and its concurrency group for a gate nobody reads. The change
  # detector and Gitleaks run on every event and must
  # succeed. Semgrep and Trivy may be skipped only when the detector succeeded and decided
  # that this pull request touches no code; every other result fails the gate.
  security-gate:
    name: Security Scan Gate
    needs: [changes, semgrep, trivy, gitleaks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Fail unless every scan succeeded or the detector excluded it
        env:
          EVENT_NAME: ${{ github.event_name }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
        run: |
          set -euo pipefail
          detector_excluded=false
          if [[ "${CHANGES_RESULT}" == "success" && "${EVENT_NAME}" == "pull_request" \
            && "${CODE_CHANGED}" != "true" ]]; then
            detector_excluded=true
          fi
          echo "event: ${EVENT_NAME}, code changed: ${CODE_CHANGED:-unset}, detector excluded scans: ${detector_excluded}"
          status=0
          for entry in "changes=${CHANGES_RESULT}" "semgrep=${SEMGREP_RESULT}" \
            "trivy=${TRIVY_RESULT}" "gitleaks=${GITLEAKS_RESULT}"; do
            job="${entry%%=*}"
            result="${entry#*=}"
            echo "${job}: ${result}"
            if [[ "${result}" == "success" ]]; then
              continue
            fi
            if [[ "${result}" == "skipped" && "${detector_excluded}" == "true" ]] \
              && [[ "${job}" == "semgrep" || "${job}" == "trivy" ]]; then
              continue
            fi
            echo "::error::security scan job '${job}' ended with result '${result}'"
            status=1
          done
          exit "${status}"
