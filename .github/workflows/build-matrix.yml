---
name: build-matrix
on:
  # A pull request that touches what a build reads compiles all twelve legs; required-checks
  # waits for them (docs/repository-governance.md). The list is every file the build path runs
  # or reads: the scripts this workflow calls and the ones they call, the fragments, the
  # manifest, the signing keys, the builder image and this workflow.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "scripts/build_kernel.sh"
      - "scripts/merge-config.sh"
      - "scripts/fetch-kernel-source.sh"
      - "scripts/kconfig_survival.py"
      - "scripts/check_required_config.py"
      - "scripts/verify_kernel_requirement.py"
      - "scripts/versions_query.py"
      - "scripts/install-build-toolchain.sh"
      - "scripts/probe-build-space.sh"
      - "scripts/check_kernel_artifacts.py"
      - "scripts/verify-reproducibility.sh"
      - "scripts/sign_kernel_modules.py"
      - "scripts/boot_smoke.py"
      - "scripts/build_sched_ext_scheduler.sh"
      - "scripts/package-uki.sh"
      - "scripts/check_uki.py"
      - "scripts/publish_release.sh"
      - "docker/Dockerfile.builder"
      - "kconfig/**"
      - "patches/**"
      - "scripts/check_patches_apply.py"
      - "keys/**"
      - "versions.json"
      - ".github/workflows/build-matrix.yml"
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "State what each leg would build instead of compiling it"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # One group per branch: a pull request run (head_ref) and a dispatch on its branch (ref_name)
  # share it, so the two never compile the same twelve legs side by side; a second run waits.
  # A new push to a pull request supersedes the running build of its branch, a dispatched one
  # included; a scheduled run, or a dispatch on a branch with no pull request, is never cancelled.
  group: build-matrix-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Kernel (${{ matrix.stream }} / ${{ matrix.arch }})
    # arm64 compiles natively on the hosted arm64 runner; riscv64 has no hosted runner and
    # cross-compiles on x86_64 (docs/adr/0009-kernel-compilation-and-artifact-gate.md).
    runs-on: ${{ matrix.runner }}
    # timeout and disk_gib per architecture, from the local builds of 2026-09-29 (32 threads,
    # cold compiler cache): x86_64 compiled in 2000 to 2600 CPU-seconds with a 5.1 to 5.9 GiB
    # object tree; arm64 defconfig in 9700 CPU-seconds with an 11 GiB tree; riscv64, which
    # carries no debug information, in 3300 CPU-seconds with a 1.1 GiB tree. On a 4-vCPU runner
    # at half the local per-thread speed that is about 25, 80 and 28 minutes of compile; the
    # limits add the install, the fetch and a margin. disk_gib is the tree plus the source, the
    # cache and the packages, rounded up. On the hosted runners, with a cold compiler cache, runs
    # 36504114874 and 36507112520 measured a compile of 1029 to 1208 s on x86_64, 1023 to 1572 s
    # on riscv64 and 2087 to 2250 s on arm64; the longest whole leg took 40 minutes (arm64).
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    container:
      # One digest for every workflow that runs ubuntu:26.04, publish-release.yml's build
      # included, so a release compiles in the userland this matrix proved (tests/test_workflows.py).
      image: ubuntu:26.04@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78
      volumes:
        - /mnt:/mnt
    strategy:
      fail-fast: false
      # The organisation's hosted runners are one pool for every repository; twelve legs of up
      # to 90 minutes each left other repositories' jobs queued (2026-10-17). Six at a time
      # finish in two waves; required-aggregator.yml waits for both.
      max-parallel: 6
      matrix:
        stream:
          - bleeding
          - mainstream
          - lts
          - realtime
        arch:
          - x86_64
          - arm64
          - riscv64
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            timeout: 60
            disk_gib: 10
          - arch: arm64
            runner: ubuntu-24.04-arm
            timeout: 90
            disk_gib: 16
          - arch: riscv64
            runner: ubuntu-24.04
            timeout: 60
            disk_gib: 8
    env:
      STREAM: ${{ matrix.stream }}
      ARCH: ${{ matrix.arch }}
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
      CCACHE_MAXSIZE: 700M
    defaults:
      run:
        # The container's default shell is dash; the steps below need bash.
        shell: bash

    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install the Build Toolchain
        env:
          WITH_QEMU: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          if [[ "${WITH_QEMU}" == "true" ]]; then
            bash ./scripts/install-build-toolchain.sh --with-qemu
          else
            bash ./scripts/install-build-toolchain.sh
          fi

      # The hosted runners keep a larger scratch disk at /mnt; the build goes wherever there is
      # more room, and a runner without enough anywhere fails here rather than an hour in.
      - name: Probe Free Disk Space
        id: disk
        if: env.DRY_RUN != 'true'
        env:
          NEED_GIB: ${{ matrix.disk_gib }}
        run: |
          set -euo pipefail
          base="$(./scripts/probe-build-space.sh --need-gib="${NEED_GIB}" "${GITHUB_WORKSPACE}" /mnt)"
          echo "work_dir=${base}/nucleus-build" >> "${GITHUB_OUTPUT}"

      # The resolved configuration's digest is known only after the build, so the cache is
      # restored by prefix, the leg's newest entry first, and every run saves a new entry under
      # that digest and the run's id; the repository's cache evicts the least recently used.
      - name: Restore the Compiler Cache
        if: env.DRY_RUN != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ matrix.stream }}-${{ matrix.arch }}-restore-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.stream }}-${{ matrix.arch }}-

      - name: Compile Kernel Package
        id: build
        env:
          WORK_DIR: ${{ steps.disk.outputs.work_dir }}
        run: |
          set -euo pipefail
          if [[ "${DRY_RUN}" == "true" ]]; then
            ./scripts/build_kernel.sh --stream="${STREAM}" --arch="${ARCH}" --dry-run
            exit 0
          fi
          # In a container job the github.workspace context names the host path; GITHUB_WORKSPACE does not.
          export PATH="/usr/lib/ccache:${PATH}" CCACHE_DIR="${GITHUB_WORKSPACE}/.ccache"
          ./scripts/build_kernel.sh --stream="${STREAM}" --arch="${ARCH}" \
            --work-dir="${WORK_DIR}" --output-dir="output/${STREAM}-${ARCH}"
          record="${WORK_DIR}/${STREAM}-${ARCH}/build.json"
          mkdir -p records
          cp "${record}" "records/build-${STREAM}-${ARCH}.json"
          python3 - "${record}" >> "${GITHUB_OUTPUT}" <<'PY'
          import json, sys
          record = json.load(open(sys.argv[1], encoding="utf-8"))
          print(f"kernelrelease={record['kernelrelease']}")
          print(f"config_sha256={record['config_sha256']}")
          PY
          ccache --show-stats

      - name: Keep the Build Log
        if: failure() && steps.disk.outputs.work_dir != ''
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: build-log-${{ matrix.stream }}-${{ matrix.arch }}
          path: ${{ steps.disk.outputs.work_dir }}/${{ matrix.stream }}-${{ matrix.arch }}/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build the sched_ext Scheduler
        if: matrix.arch == 'x86_64' && env.DRY_RUN != 'true'
        shell: bash
        env:
          WORK_DIR: ${{ steps.disk.outputs.work_dir }}
        run: |
          set -euo pipefail
          bash ./scripts/build_sched_ext_scheduler.sh \
            --source-tree="${WORK_DIR}/linux-${STREAM}" \
            --vmlinux="${WORK_DIR}/${STREAM}-${ARCH}/kbuild/vmlinux" \
            --output="records/scx_simple-${STREAM}-${ARCH}"

      - name: Save the Compiler Cache
        if: always() && steps.build.outputs.config_sha256 != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ matrix.stream }}-${{ matrix.arch }}-${{ steps.build.outputs.config_sha256 }}-${{ github.run_id }}-${{ github.run_attempt }}

      # TCG, not KVM: the container has no /dev/kvm, and a boot to userspace takes seconds.
      - name: Boot the Kernel to Userspace
        id: boot
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          KERNELRELEASE: ${{ steps.build.outputs.kernelrelease }}
          BOOT_TIMEOUT: ${{ matrix.arch == 'x86_64' && '300' || '600' }}
        run: |
          set -euo pipefail
          boot_args=(
            --arch="${ARCH}"
            --kernel="output/${STREAM}-${ARCH}/vmlinuz-${KERNELRELEASE}"
            --kernelrelease="${KERNELRELEASE}"
            --timeout="${BOOT_TIMEOUT}"
            --log="records/boot-${STREAM}-${ARCH}.log"
          )
          # The bbr3 series registers "bbr3" from a module (CONFIG_TCP_CONG_BBR3=m), so a
          # bound stream's boot loads tcp_bbr3.ko from its own image package before it reads
          # tcp_available_congestion_control. The binding comes from versions.json.
          bbr3=no
          if [[ "${ARCH}" == "x86_64" ]]; then
            boot_args+=(
              --require-sched-ext
              --scheduler="records/scx_simple-${STREAM}-${ARCH}"
              --require-scheduler=simple
            )
            bound="$(python3 scripts/versions_query.py series-streams bbr3)"
            if grep -qxF -- "${STREAM}" <<<"${bound}"; then bbr3=yes; fi
            if [[ "${bbr3}" == "yes" ]]; then
              deb_pkg=$(find "output/${STREAM}-${ARCH}" -maxdepth 1 -name "linux-image-*.deb" ! -name "*-dbg*" | head -n 1)
              mod_tmp=$(mktemp -d)
              dpkg-deb --fsys-tarfile "${deb_pkg}" | \
                tar -x -C "${mod_tmp}" --wildcards "*lib/modules/${KERNELRELEASE}/kernel/net/ipv4/tcp_bbr3.ko"
              mod_path="${mod_tmp}/lib/modules/${KERNELRELEASE}/kernel/net/ipv4/tcp_bbr3.ko"
              boot_args+=(--module="${mod_path}" --require-congestion=bbr --require-congestion=bbr3)
            fi
          fi
          echo "bbr3=${bbr3}" >> "${GITHUB_OUTPUT}"
          python3 scripts/boot_smoke.py "${boot_args[@]}"

      # The verdict is what ties the boot to this leg's release: judge the console the boot
      # just wrote with that release (it must pass) and with one the leg did not build (it
      # must be refused), so a verdict that ignored the release could not stay green.
      - name: Refuse a console of another release
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          KERNELRELEASE: ${{ steps.build.outputs.kernelrelease }}
          BBR3: ${{ steps.boot.outputs.bbr3 }}
        run: |
          set -euo pipefail
          log="records/boot-${STREAM}-${ARCH}.log"
          judge_args=()
          if [[ "${ARCH}" == "x86_64" ]]; then
            judge_args+=(--require-sched-ext --require-scheduler=simple)
            if [[ "${BBR3}" == "yes" ]]; then
              judge_args+=(--require-congestion=bbr --require-congestion=bbr3)
            fi
          fi
          python3 scripts/boot_smoke.py --judge-log="${log}" --kernelrelease="${KERNELRELEASE}" "${judge_args[@]}"
          rc=0
          python3 scripts/boot_smoke.py --judge-log="${log}" \
            --kernelrelease="${KERNELRELEASE}-planted" "${judge_args[@]}" || rc=$?
          if [[ "${rc}" -ne 1 ]]; then
            echo "Expected exit status 1 for release ${KERNELRELEASE}-planted, got ${rc}" >&2
            exit 1
          fi
          if [[ "${ARCH}" == "x86_64" ]]; then
            rc=0
            python3 scripts/boot_smoke.py --judge-log="${log}" \
              --kernelrelease="${KERNELRELEASE}" \
              --require-congestion=planted-cc || rc=$?
            if [[ "${rc}" -ne 1 ]]; then
              echo "Expected exit status 1 for congestion planted-cc, got ${rc}" >&2
              exit 1
            fi
            rc=0
            python3 scripts/boot_smoke.py --judge-log="${log}" \
              --kernelrelease="${KERNELRELEASE}" \
              --require-scheduler=planted-sched || rc=$?
            if [[ "${rc}" -ne 1 ]]; then
              echo "Expected exit status 1 for scheduler planted-sched, got ${rc}" >&2
              exit 1
            fi
          fi

      - name: Refuse a boot whose console stays silent
        if: matrix.arch != 'x86_64' && env.DRY_RUN != 'true'
        env:
          KERNELRELEASE: ${{ steps.build.outputs.kernelrelease }}
          SILENT_CONSOLE: ${{ matrix.arch == 'arm64' && 'ttyS9' || 'ttyAMA9' }}
        run: |
          set -euo pipefail
          rc=0
          python3 scripts/boot_smoke.py --arch="${ARCH}" \
            --kernel="output/${STREAM}-${ARCH}/vmlinuz-${KERNELRELEASE}" \
            --kernelrelease="${KERNELRELEASE}" --console="${SILENT_CONSOLE}" \
            --timeout=600 || rc=$?
          if [[ "${rc}" -ne 1 ]]; then
            echo "Expected exit status 1 for silent console ${SILENT_CONSOLE}, got ${rc}" >&2
            exit 1
          fi

      # UKI synthesis: Ubuntu 26.04 systemd-boot-efi ships linuxx64.efi.stub on amd64 and
      # linuxaa64.efi.stub on arm64. riscv64 is cross-compiled on an x86_64 runner, which has
      # no riscv64 stub, so the UKI build check skips riscv64. The UKI is a build check only:
      # never staged into the artifact dir, SHA256SUMS or releases.
      - name: Build UKI from Nucleus Kernel
        if: matrix.arch != 'riscv64' && env.DRY_RUN != 'true'
        env:
          KERNELRELEASE: ${{ steps.build.outputs.kernelrelease }}
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends systemd-ukify systemd-boot-efi
          uki_dir="${RUNNER_TEMP}/uki-${STREAM}-${ARCH}"
          mkdir -p "${uki_dir}"
          initrd="${uki_dir}/initramfs.cpio"
          python3 scripts/boot_smoke.py --arch="${ARCH}" --write-initramfs="${initrd}"
          ./scripts/package-uki.sh --stream="${STREAM}" --arch="${ARCH}" \
            --vmlinuz="output/${STREAM}-${ARCH}/vmlinuz-${KERNELRELEASE}" \
            --initrd="${initrd}" \
            --output-dir="${uki_dir}"

      - name: Refuse a UKI when vmlinuz is not a kernel
        if: matrix.arch != 'riscv64' && env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          neg_dir="${RUNNER_TEMP}/uki-negative-${STREAM}-${ARCH}"
          mkdir -p "${neg_dir}"
          initrd="${RUNNER_TEMP}/uki-${STREAM}-${ARCH}/initramfs.cpio"
          rc=0
          ./scripts/package-uki.sh --stream="${STREAM}" --arch="${ARCH}" \
            --vmlinuz="${initrd}" \
            --output-dir="${neg_dir}" || rc=$?
          if [[ "${rc}" -eq 0 ]]; then
            echo "Expected package-uki.sh to fail on non-kernel binary, but it succeeded" >&2
            exit 1
          fi
          if [[ -n "$(find "${neg_dir}" -type f -iname '*.efi')" ]]; then
            echo "package-uki.sh left a .efi file in ${neg_dir} after failure" >&2
            exit 1
          fi

      - name: Stage Artifacts and Checksums
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          OUTPUT_DIR="output/${STREAM}-${ARCH}" ./scripts/publish_release.sh "build-${STREAM}-${ARCH}"

      - name: Upload Build Artifacts
        if: env.DRY_RUN != 'true'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: kernel-${{ matrix.stream }}-${{ matrix.arch }}
          path: |
            output/${{ matrix.stream }}-${{ matrix.arch }}/
            records/
          if-no-files-found: error
          retention-days: 7

  # Issue #77: two builds of one tag must write the same bytes. One leg is built twice in one
  # job, from a fresh tree each time, under the same work directory, without the compiler cache
  # (a cache hit would hide a compiler that writes different bytes), and with one module signing
  # key that is generated here and deleted afterwards (docs/adr/0016-module-signing-after-the-build.md).
  # verify-reproducibility.sh then compares the two output directories file by file. The
  # mainstream/x86_64 leg of run 38991220451 compiled in 1276 s and took 23 minutes, so two
  # builds fit inside the job's limit and required-checks' wait.
  reproducibility:
    name: Reproducible Build (mainstream / x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    permissions:
      contents: read
    container:
      image: ubuntu:26.04@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78
      volumes:
        - /mnt:/mnt
    env:
      STREAM: mainstream
      ARCH: x86_64
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install the Build Toolchain
        run: |
          set -euo pipefail
          bash ./scripts/install-build-toolchain.sh

      - name: State the Comparison
        if: env.DRY_RUN == 'true'
        run: |
          set -euo pipefail
          ./scripts/build_kernel.sh --stream="${STREAM}" --arch="${ARCH}" --dry-run
          ./scripts/verify-reproducibility.sh --dir-a=repro/a --dir-b=repro/b --dry-run

      # One tree at a time (x86_64 needs 10 GiB above) and two output directories of about 60 MiB.
      - name: Probe Free Disk Space
        id: disk
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          base="$(./scripts/probe-build-space.sh --need-gib=12 "${GITHUB_WORKSPACE}" /mnt)"
          echo "work_dir=${base}/nucleus-repro" >> "${GITHUB_OUTPUT}"
          echo "key_dir=${base}/nucleus-repro-key" >> "${GITHUB_OUTPUT}"

      - name: Generate the Module Signing Key for Both Builds
        if: env.DRY_RUN != 'true'
        env:
          KEY_DIR: ${{ steps.disk.outputs.key_dir }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "${KEY_DIR}"
          openssl req -new -nodes -utf8 -sha512 -days 1 -batch -x509 -newkey rsa:4096 \
            -subj "/CN=nucleus reproducibility check" \
            -keyout "${KEY_DIR}/key.pem" -out "${KEY_DIR}/cert.pem"
          cat "${KEY_DIR}/key.pem" "${KEY_DIR}/cert.pem" > "${KEY_DIR}/module-key.pem"
          rm -f "${KEY_DIR}/key.pem" "${KEY_DIR}/cert.pem"

      - name: Build Twice and Compare
        if: env.DRY_RUN != 'true'
        env:
          WORK_DIR: ${{ steps.disk.outputs.work_dir }}
          KEY: ${{ steps.disk.outputs.key_dir }}/module-key.pem
        run: |
          set -euo pipefail
          for side in a b; do
            rm -rf "${WORK_DIR}"
            ./scripts/build_kernel.sh --stream="${STREAM}" --arch="${ARCH}" \
              --work-dir="${WORK_DIR}" --output-dir="repro/${side}" --module-key="${KEY}"
            mkdir -p repro/records
            cp "${WORK_DIR}/${STREAM}-${ARCH}/build.json" "repro/records/build-${side}.json"
          done
          ./scripts/verify-reproducibility.sh --dir-a=repro/a --dir-b=repro/b

      - name: Delete the Module Signing Key
        if: always() && steps.disk.outputs.key_dir != ''
        env:
          KEY_DIR: ${{ steps.disk.outputs.key_dir }}
        run: |
          set -euo pipefail
          rm -rf "${KEY_DIR}"

      - name: Keep Both Builds for Inspection
        if: failure() && steps.disk.outputs.work_dir != ''
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: reproducibility-${{ github.run_id }}
          path: repro/
          if-no-files-found: ignore
          retention-days: 3

  # The local build container (docker/Dockerfile.builder) installs the toolchain with the same
  # script as the matrix above; this job builds it and checks the toolchain inside it
  # (tests/test_builder_image.py keeps the two from drifting apart).
  builder-image:
    name: Builder Image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build docker/Dockerfile.builder
        run: docker build -t nucleus-builder -f docker/Dockerfile.builder .
      - name: Check the toolchain and plan a build inside it
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src nucleus-builder bash -c '
            set -euo pipefail
            for tool in make gcc aarch64-linux-gnu-gcc riscv64-linux-gnu-gcc pahole gnuinstall qemu-system-x86_64 ccache gpgv; do
              command -v "$tool" >/dev/null || { echo "missing $tool" >&2; exit 1; }
            done
            scripts/build_kernel.sh --stream=mainstream --arch=x86_64 --dry-run'
