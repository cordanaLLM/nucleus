---
name: build-matrix
on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run dry-run simulation instead of full compilation"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: build-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Kernel (${{ matrix.stream }} / ${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    container:
      image: ubuntu:26.04
    strategy:
      fail-fast: false
      matrix:
        stream:
          - bleeding
          - mainstream
          - lts
          - realtime
        arch:
          - x86_64
          - arm64
          - riscv64

    steps:
      - name: Install Build Toolchain Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update && apt-get install -y --no-install-recommends \
            build-essential libncurses-dev bison flex libssl-dev libelf-dev \
            bc fakeroot rsync debhelper kmod python3 git ca-certificates bash

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Compile Kernel Package
        # The container's default shell is dash, which cannot parse the array below.
        shell: bash
        env:
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          EXTRA_ARGS=()
          if [[ "${DRY_RUN_INPUT}" == "true" ]]; then
            EXTRA_ARGS+=("--dry-run")
          fi
          ./scripts/build_kernel.sh --stream="${{ matrix.stream }}" --arch="${{ matrix.arch }}" "${EXTRA_ARGS[@]}"

      - name: Stage Artifacts and Checksums
        run: |
          mkdir -p output
          ./scripts/publish_release.sh "v${{ matrix.stream }}-$(date +'%Y%m%d')"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: kernel-${{ matrix.stream }}-${{ matrix.arch }}
          path: output/
          retention-days: 7
