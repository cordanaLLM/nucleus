---
name: build-matrix
on:
  workflow_dispatch:
    inputs:
      stream:
        description: "Target kernel stream (bleeding, mainstream, lts, realtime)"
        required: true
        default: "mainstream"
      arch:
        description: "Target architecture (x86_64, arm64, riscv64)"
        required: true
        default: "x86_64"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.stream }}-${{ github.event.inputs.arch }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Kernel Package
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Build Environment
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential libncurses-dev bison flex libssl-dev libelf-dev \
            bc fakeroot rsync debhelper kmod python3

      - name: Compile Kernel
        env:
          INPUT_STREAM: ${{ github.event.inputs.stream }}
          INPUT_ARCH: ${{ github.event.inputs.arch }}
        run: |
          ./scripts/build_kernel.sh --stream="${INPUT_STREAM}" --arch="${INPUT_ARCH}"

      - name: Generate Checksums & Stage Release
        run: |
          ./scripts/publish_release.sh "v${{ github.event.inputs.stream }}-$(date +'%Y%m%d')"

      - name: Notify Downstream Image Forge
        env:
          INPUT_STREAM: ${{ github.event.inputs.stream }}
          GITHUB_TOKEN: ${{ secrets.KERNEL_FORGE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('versions.json'))['streams']['${INPUT_STREAM}']['version'])")
          ./scripts/notify_downstream.sh "${INPUT_STREAM}" "${VERSION}-lusoris1"
