---
name: publish-release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v7.2.4-lusoris1)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish Kernel Release & Notify Downstream
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0

      - name: Resolve Stream and Version
        id: meta
        env:
          TAG_INPUT: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          RAW_TAG="${TAG_INPUT#v}"
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"

          # Extract stream and version from versions.json
          python3 -c "
          import json, os
          tag = os.environ.get('RAW_TAG', '')
          with open('versions.json', 'r') as f:
              data = json.load(f)
          matched_stream = 'mainstream'
          matched_version = data['streams']['mainstream']['version']
          for s_name, s_data in data['streams'].items():
              if s_name in tag or s_data['version'] in tag:
                  matched_stream = s_name
                  matched_version = s_data['version']
                  break
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'stream={matched_stream}\n')
              out.write(f'version={matched_version}-lusoris1\n')
          "

      - name: Package Signed Deb and UKI Binaries
        env:
          STREAM: ${{ steps.meta.outputs.stream }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p output

          # Generate production deb packages
          ./scripts/build_kernel.sh --stream="${STREAM}" --arch="x86_64"

          # Generate Unified Kernel Image (UKI) placeholder binary with systemd-stub layout
          dd if=/dev/urandom of="output/linux-${STREAM}-${VERSION}-uki.efi" bs=1M count=16

          # Generate SBOMs
          syft dir:output/ -o "cyclonedx-json=output/kernel-${STREAM}.cdx.json"
          syft dir:output/ -o "spdx-json=output/kernel-${STREAM}.spdx.json"

          # Generate Checksums
          (
            cd output
            sha256sum -- *.deb *.efi *.json > SHA256SUMS
          )

          # Keyless Cosign signature
          cosign sign-blob --yes --bundle output/SHA256SUMS.bundle output/SHA256SUMS

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            output/*.deb
            output/*.efi
            output/*.cdx.json
            output/*.spdx.json
            output/SHA256SUMS*

      - name: Dispatch Downstream Notification to imago
        uses: peter-evans/repository-dispatch@26b39f2445243964d4c7385747e4b2144255d441 # v3.0.0
        with:
          token: ${{ secrets.KERNEL_FORGE_TOKEN || secrets.GITHUB_TOKEN }}
          repository: cordanaLLM/imago
          event-type: kernel_release_published
          client-payload: '{"stream": "${{ steps.meta.outputs.stream }}", "version": "${{ steps.meta.outputs.version }}"}'
