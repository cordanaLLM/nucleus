---
name: publish-release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Kernel release tag v<version>-<stream>-lusoris1 (<version> = the stream's version in versions.json); start the run from this tag (--ref)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish Kernel Release & Notify Downstream
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # GITHUB_TOKEN is scoped to this repository and cannot dispatch to cordanaLLM/imago, so
      # there is no fallback to it: without KERNEL_FORGE_TOKEN the run stops here, before
      # anything is built, signed or published, and says so. The step sees only whether the
      # secret is set, never its value; the dispatch step below is the one place that reads it.
      - name: Require KERNEL_FORGE_TOKEN for the Downstream Dispatch
        env:
          KERNEL_FORGE_TOKEN_SET: ${{ secrets.KERNEL_FORGE_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [[ "${KERNEL_FORGE_TOKEN_SET}" != "true" ]]; then
            message="KERNEL_FORGE_TOKEN is not set. The downstream dispatch needs a token that may send"
            message+=" repository_dispatch events to the downstream repository; GITHUB_TOKEN cannot reach it."
            echo "::error title=Missing secret KERNEL_FORGE_TOKEN::${message}" >&2
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0

      # A kernel release tag is v<version>-<stream>-lusoris<N> and must name exactly one
      # versions.json stream at exactly its version. Anything else, including the
      # repository's own nucleus-v<X.Y.Z> tags, is refused here and nothing is published.
      # The run must also have started from that tag (--ref): checkout, the signer identity
      # and the release all follow GITHUB_REF, so a manual dispatch of tag X from another ref
      # would otherwise release the assets under the wrong tag.
      # Outputs: stream, version, rev, release_tag, release_version (<version>-lusoris<N>).
      - name: Resolve Stream and Version
        id: meta
        env:
          TAG_INPUT: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/resolve_release_tag.py --tag "${TAG_INPUT}" --ref "${GITHUB_REF}" --github-output "${GITHUB_OUTPUT}"

      - name: Package Signed Deb and UKI Binaries
        env:
          STREAM: ${{ steps.meta.outputs.stream }}
          VERSION: ${{ steps.meta.outputs.release_version }}
        run: |
          set -euo pipefail
          mkdir -p output

          # Generate production deb packages
          ./scripts/build_kernel.sh --stream="${STREAM}" --arch="x86_64"


          # Ship the merged kconfig the build used; imago pins its digest as kernel.config_digest
          ./scripts/merge-config.sh --arch=x86_64 --output="output/kernel-${STREAM}.config"

          # Generate SBOMs
          syft dir:output/ -o "cyclonedx-json=output/kernel-${STREAM}.cdx.json"
          syft dir:output/ -o "spdx-json=output/kernel-${STREAM}.spdx.json"

          # Generate Checksums
          (
            cd output
            sha256sum -- *.deb *.json *.config > SHA256SUMS
          )

          # Keyless Cosign signature
          cosign sign-blob --yes --bundle output/SHA256SUMS.bundle output/SHA256SUMS

      # imago.nucleus.kernel-artifact.v1 is owned by cordanaLLM/imago (pkg/kernel). The manifest
      # is written after SHA256SUMS is signed and is deliberately absent from it: imago verifies
      # the cosign bundle, the SHA256SUMS digest, and every artifact digest before pinning the stream.
      - name: Generate Kernel Artifact Manifest
        env:
          STREAM: ${{ steps.meta.outputs.stream }}
          VERSION: ${{ steps.meta.outputs.release_version }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          SIGNER_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish-release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          out = Path("output")
          stream = os.environ["STREAM"]
          version = os.environ["VERSION"]
          repository = os.environ["GITHUB_REPOSITORY"]

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          artifacts = []
          for line in (out / "SHA256SUMS").read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              hexdigest, name = line.split(maxsplit=1)
              name = name.lstrip("*")
              artifacts.append({"name": name, "sha256": hexdigest, "size": (out / name).stat().st_size})

          manifest = {
              "schema": "imago.nucleus.kernel-artifact.v1",
              "provider": repository,
              "stream": stream,
              "version": version,
              "kernel": {
                  "release": version,
                  "config_digest": "sha256:" + digest(out / f"kernel-{stream}.config"),
              },
              "artifacts": artifacts,
              "checksums": {"file": "SHA256SUMS", "sha256": digest(out / "SHA256SUMS")},
              "provenance": {
                  "repository": repository,
                  "tag": os.environ["RELEASE_TAG"],
                  "revision": os.environ["GITHUB_SHA"],
                  "bundle": "SHA256SUMS.bundle",
                  "signer_identity": os.environ["SIGNER_IDENTITY"],
              },
          }
          target = out / f"kernel-{stream}.manifest.json"
          target.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(target.read_text(encoding="utf-8"))
          PY

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          files: |
            output/*.deb
            output/*.config
            output/*.cdx.json
            output/*.spdx.json
            output/*.manifest.json
            output/SHA256SUMS*

      - name: Dispatch Downstream Notification to imago
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ secrets.KERNEL_FORGE_TOKEN }}
          repository: cordanaLLM/imago
          event-type: kernel_release_published
          client-payload: '{"stream": "${{ steps.meta.outputs.stream }}", "version": "${{ steps.meta.outputs.release_version }}", "tag": "${{ steps.meta.outputs.release_tag }}"}'
