---
name: publish-release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Kernel release tag v<version>-<stream>-lusoris<N> (<version> = the stream's versions.json version, <N> = revision 1-9999); start the run from the tag (--ref)"
        required: true

permissions:
  contents: read

jobs:
  # GITHUB_TOKEN is scoped to this repository and cannot dispatch to cordanaLLM/imago, so
  # there is no fallback to it: without KERNEL_FORGE_TOKEN the run stops here, before
  # anything is built, signed or published, and says so. The step sees only whether the
  # secret is set, never its value; the dispatch step below is the one place that reads it.
  preflight:
    name: Preflight Token Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require KERNEL_FORGE_TOKEN for the Downstream Dispatch
        env:
          KERNEL_FORGE_TOKEN_SET: ${{ secrets.KERNEL_FORGE_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [[ "${KERNEL_FORGE_TOKEN_SET}" != "true" ]]; then
            message="KERNEL_FORGE_TOKEN is not set. The downstream dispatch needs a token that may send"
            message+=" repository_dispatch events to the downstream repository; GITHUB_TOKEN cannot reach it."
            echo "::error title=Missing secret KERNEL_FORGE_TOKEN::${message}" >&2
            exit 1
          fi

  build:
    name: Reusable Release Build
    needs: preflight
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ github.event.inputs.tag || '' }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

  publish:
    name: Publish Kernel Release & Notify Downstream
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: output

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          make_latest: ${{ needs.build.outputs.make_latest }}
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          body: >-
            The x86_64 Unified Kernel Image (linux-*-uki.efi) is unsigned for Secure Boot;
            arm64 and riscv64 ship no UKI with releases.
          files: |
            output/*.deb
            output/vmlinuz-*
            output/*.config
            output/*-uki.efi
            output/*.cdx.json
            output/*.spdx.json
            output/*.manifest.json
            output/SHA256SUMS*
            output/*.provenance.sigstore.json

      - name: Dispatch Downstream Notification to imago
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.KERNEL_FORGE_TOKEN }}
          repository: cordanaLLM/imago
          event-type: kernel_release_published
          client-payload: >-
            {"stream": "${{ needs.build.outputs.stream }}", "version": "${{ needs.build.outputs.release_version }}", "tag": "${{ needs.build.outputs.release_tag }}"}
