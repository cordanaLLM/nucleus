---
name: ci
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push to a pull request cancels its running run; a run for main is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The praetor commit whose praetorctl the governance job builds. The catalog under
  # .config/archetypes/ must match this commit's copies and .standards.lock must pin
  # them. Bump it as described in docs/repository-governance.md; versions.json pins
  # kernel streams, not tools.
  PRAETOR_REF: "7b38b3bceecad41c9e8aa71851432d0dcaa7c0b1"

jobs:
  lint-and-test:
    name: Lint & Pytest Quality Gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 3.12 is the floor pyproject.toml declares and stays the default python (setup-python
      # makes the last listed version the default); 3.14 is the python3 of ubuntu:26.04, which
      # runs the artifact gate, the boot test and the manifest in every build and release.
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.14
            3.12

      - name: Install System Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y shellcheck yamllint
          # renovate updates both lines (github-release-attachments).
          actionlint_version=v1.7.12
          actionlint_sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -sSfL --connect-timeout 20 --max-time 120 -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/${actionlint_version}/actionlint_${actionlint_version#v}_linux_amd64.tar.gz
          echo "${actionlint_sha256}  actionlint.tar.gz" | sha256sum -c
          tar -xzf actionlint.tar.gz actionlint
          sudo mv ./actionlint /usr/local/bin/
          rm -f actionlint.tar.gz
          pip install --no-cache-dir --require-hashes -r requirements-test.txt

      - name: Run Makefile Gates
        run: |
          make lint
          make audit
          make test
          make docs-build

      # The same lock and suite on the build container's interpreter. The job keeps one
      # name, so the required check context the ruleset names does not change.
      - name: Pytest on Python 3.14
        run: |
          set -euo pipefail
          python3.14 -m venv "${RUNNER_TEMP}/py314"
          "${RUNNER_TEMP}/py314/bin/pip" install --no-cache-dir --require-hashes -r requirements-test.txt
          PATH="${RUNNER_TEMP}/py314/bin:${PATH}" python -m pytest -q -p no:cacheprovider

      # The harness Scorecard's Fuzzing check looks for (docs/principles.md, Fuzzing). Atheris
      # ships x86_64 wheels for Python 3.12 to 3.14 only. The corpus is copied so that the
      # inputs the fuzzer adds stay out of the checkout.
      - name: Fuzz the requirement parser
        run: |
          set -euo pipefail
          python3.12 -m venv "${RUNNER_TEMP}/fuzz"
          "${RUNNER_TEMP}/fuzz/bin/pip" install --no-cache-dir --require-hashes -r requirements-fuzz.txt
          cp -r fuzz/corpus/verify_kernel_requirement "${RUNNER_TEMP}/corpus"
          "${RUNNER_TEMP}/fuzz/bin/python" fuzz/fuzz_verify_kernel_requirement.py -max_total_time=60 "${RUNNER_TEMP}/corpus"

      # actionlint checks the form of a pin, not that it exists: a SHA that no upstream
      # commit carries fails only at "Set up job" of the workflow that uses it. zizmor
      # checks each pin against its upstream; the fixtures prove the gate still refuses.
      - name: Verify Action Pins Upstream
        env:
          GH_TOKEN: ${{ github.token }}
          NUCLEUS_REQUIRE_PIN_FIXTURES: "1"
        run: |
          make lint-pins
          python -m pytest -q -p no:cacheprovider tests/test_lint_pins.py

  # The job above runs without ukify, so it can only prove refusals. This one builds a real
  # UKI with package-uki.sh, which is the positive case of issue #21. The input is Ubuntu's own
  # kernel image, so the job needs no kernel build; the result is never published.
  uki-real-ukify:
    name: UKI Real ukify Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # The digest every workflow that runs ubuntu:26.04 pins (tests/test_workflows.py).
      image: ubuntu:26.04@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78
    defaults:
      run:
        shell: bash
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Install ukify, the systemd-stub and pytest
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            systemd-ukify systemd-boot-efi python3 python3-pytest ca-certificates git

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch a stock Ubuntu kernel image
        run: |
          # awk reads to the end: exiting early could SIGPIPE apt-cache, which pipefail reports.
          image_pkg="$(apt-cache depends linux-image-generic | awk '/Depends: linux-image-/ && !n++ {print $2}')"
          test -n "${image_pkg}"
          mkdir -p "${RUNNER_TEMP}/kernel"
          cd "${RUNNER_TEMP}/kernel"
          apt-get download "${image_pkg}"
          dpkg-deb -x "${image_pkg}"_*.deb root
          vmlinuz="$(find "${PWD}/root/boot" -maxdepth 1 -type f -name 'vmlinuz-*' -print -quit)"
          test -s "${vmlinuz}"
          echo "NUCLEUS_UKI_TEST_VMLINUZ=${vmlinuz}" >> "${GITHUB_ENV}"

      - name: Install a hostile ukify.conf
        run: |
          # ukify reads the first ukify.conf it finds under /etc/systemd. This one asks for a
          # microcode section; package-uki.sh must ignore it (--config=/dev/null), so the
          # build and the tests below prove the image does not depend on the build host.
          mkdir -p /etc/systemd
          head -c 64 /dev/zero > "${RUNNER_TEMP}/hostile-microcode.img"
          printf '[UKI]\nMicrocode=%s\n' "${RUNNER_TEMP}/hostile-microcode.img" > /etc/systemd/ukify.conf
          # Control: without --config=/dev/null the config takes effect, so this step is not vacuous.
          ukify build --linux="${NUCLEUS_UKI_TEST_VMLINUZ}" --output="${RUNNER_TEMP}/control.efi"
          ukify inspect "${RUNNER_TEMP}/control.efi" | grep -F '.ucode'

      - name: Build a UKI with package-uki.sh and inspect it
        run: |
          stream="$(python3 -c 'import json; print(next(iter(json.load(open("versions.json"))["streams"])))')"
          # The architecture of this runner, which must be a target of versions.json; the stock
          # kernel is built for it. The kernel is Ubuntu's, not one this forge built.
          case "$(uname -m)" in
            x86_64) arch=x86_64 ;;
            aarch64) arch=arm64 ;;
            riscv64) arch=riscv64 ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          python3 -c 'import json, sys; assert sys.argv[1] in json.load(open("versions.json"))["architectures"], sys.argv[1]' "${arch}"
          out="${RUNNER_TEMP}/uki"
          ./scripts/package-uki.sh --stream="${stream}" --arch="${arch}" \
            --vmlinuz="${NUCLEUS_UKI_TEST_VMLINUZ}" --output-dir="${out}"
          dir="${out}/${stream}-${arch}"
          efi="$(find "${dir}" -maxdepth 1 -type f -name '*.EFI')"
          test "$(printf '%s\n' "${efi}" | wc -l)" -eq 1
          python3 scripts/check_uki.py --arch="${arch}" "${efi}"
          ukify inspect "${efi}"
          if ukify inspect "${efi}" | grep -F '.ucode'; then
            echo "the hostile ukify.conf leaked into the image" >&2
            exit 1
          fi
          (cd "${dir}" && sha256sum --check "$(basename "${efi}").sha256")

      - name: Run the UKI tests with ukify installed
        run: |
          python3 -m pytest tests/test_package_uki.py -rs -p no:cacheprovider \
            --junitxml="${RUNNER_TEMP}/uki-junit.xml"
          # The real-ukify test skips without ukify or a kernel image; here that would be a
          # silent pass, so every test in the file must have run.
          grep -q 'skipped="0"' "${RUNNER_TEMP}/uki-junit.xml"

  release-uki-dry-run:
    name: Release UKI Dry Run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # The digest every workflow that runs ubuntu:26.04 pins (tests/test_workflows.py).
      image: ubuntu:26.04@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78
    defaults:
      run:
        shell: bash
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Install ukify, the systemd-stub and tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            systemd-ukify systemd-boot-efi python3 gcc libc6-dev ca-certificates git

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch a stock Ubuntu kernel image
        run: |
          # awk reads to the end: exiting early could SIGPIPE apt-cache, which pipefail reports.
          image_pkg="$(apt-cache depends linux-image-generic | awk '/Depends: linux-image-/ && !n++ {print $2}')"
          test -n "${image_pkg}"
          mkdir -p "${RUNNER_TEMP}/kernel"
          cd "${RUNNER_TEMP}/kernel"
          # Ubuntu ships /boot/config-* in linux-modules-*, not in linux-image-*.
          modules_pkg="${image_pkg/linux-image-/linux-modules-}"
          apt-get download "${image_pkg}" "${modules_pkg}"
          dpkg-deb -x "${image_pkg}"_*.deb root
          dpkg-deb -x "${modules_pkg}"_*.deb modules
          vmlinuz="$(find "${PWD}/root/boot" -maxdepth 1 -type f -name 'vmlinuz-*' -print -quit)"
          config="$(find "${PWD}/modules/boot" -maxdepth 1 -type f -name 'config-*' -print -quit)"
          deb="$(find "${PWD}" -maxdepth 1 -type f -name "${image_pkg}_*.deb" -print -quit)"
          test -s "${vmlinuz}"
          test -s "${config}"
          test -s "${deb}"
          {
            echo "TEST_VMLINUZ=${vmlinuz}"
            echo "TEST_CONFIG=${config}"
            echo "TEST_DEB=${deb}"
          } >> "${GITHUB_ENV}"

      - name: Stage and Publish Release UKI Dry Run
        run: |
          set -euo pipefail
          stream="mainstream"
          version="$(python3 -c 'import json; print(json.load(open("versions.json"))["streams"]["mainstream"]["version"])')"
          release_version="${version}-lusoris1"
          release_dir="${RUNNER_TEMP}/release"
          mkdir -p "${release_dir}"
          cp "${TEST_DEB}" "${release_dir}/"
          cp "${TEST_VMLINUZ}" "${release_dir}/"
          cp "${TEST_CONFIG}" "${release_dir}/kernel-mainstream-x86_64.config"
          ./scripts/stage_release_uki.sh --stream="${stream}" --version="${release_version}" \
            --vmlinuz="${TEST_VMLINUZ}" --output-dir="${release_dir}"
          OUTPUT_DIR="${release_dir}" ./scripts/publish_release.sh dry-run
          summary_line="$(python3 scripts/check_release_uki.py --dir="${release_dir}" --stream="${stream}" --version="${release_version}")"
          echo "${summary_line}"
          echo "${summary_line}" >> "${GITHUB_STEP_SUMMARY}"
          echo "RELEASE_VERSION=${release_version}" >> "${GITHUB_ENV}"

      - name: Refuse a release without a UKI
        run: |
          set -euo pipefail
          fresh_dir="${RUNNER_TEMP}/release-no-uki"
          mkdir -p "${fresh_dir}"
          for f in "${RUNNER_TEMP}/release"/*; do
            if [[ "${f}" != *.efi && "${f}" != */SHA256SUMS* ]]; then
              cp "${f}" "${fresh_dir}/"
            fi
          done
          OUTPUT_DIR="${fresh_dir}" ./scripts/publish_release.sh dry-run
          rc=0
          python3 scripts/check_release_uki.py --dir="${fresh_dir}" --stream="mainstream" --version="${RELEASE_VERSION}" || rc=$?
          if [[ "${rc}" -ne 1 ]]; then
            echo "Expected check_release_uki.py to fail with exit status 1, got ${rc}" >&2
            exit 1
          fi

      - name: Refuse stage_release_uki.sh when vmlinuz is not a kernel
        run: |
          set -euo pipefail
          bad_dir="${RUNNER_TEMP}/bad-uki-output"
          mkdir -p "${bad_dir}"
          bad_vmlinuz="${RUNNER_TEMP}/not-a-kernel.txt"
          echo "not a kernel image" > "${bad_vmlinuz}"
          rc=0
          ./scripts/stage_release_uki.sh --stream="mainstream" --version="${RELEASE_VERSION}" \
            --vmlinuz="${bad_vmlinuz}" --output-dir="${bad_dir}" || rc=$?
          if [[ "${rc}" -eq 0 ]]; then
            echo "Expected stage_release_uki.sh to fail for non-kernel vmlinuz, got 0" >&2
            exit 1
          fi
          efi_count="$(find "${bad_dir}" -maxdepth 1 -name '*.efi' | wc -l)"
          if [[ "${efi_count}" -ne 0 ]]; then
            echo "Expected no *.efi in output dir on failure, found ${efi_count}" >&2
            exit 1
          fi

  governance:
    name: Praetor Governance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # No credential stays in .git/config while this job runs a binary built from another
      # repository.
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned praetor source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cordanaLLM/praetor
          ref: ${{ env.PRAETOR_REF }}
          path: praetor-src
          persist-credentials: false

      - name: Set up the Go toolchain declared by praetor
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: praetor-src/go.mod
          cache: false

      - name: Build pinned praetorctl
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
          GOFLAGS: -mod=readonly
        run: |
          set -euo pipefail
          test "$(git -C praetor-src rev-parse HEAD)" = "${PRAETOR_REF}"
          mkdir -p "${RUNNER_TEMP}/bin"
          (cd praetor-src && go mod download && go mod verify \
            && go vet ./cmd/standardsctl \
            && go build -trimpath -buildvcs=false -o "${RUNNER_TEMP}/bin/praetorctl" ./cmd/standardsctl)
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      # Fails when .standards.lock does not pin the pinned praetor's catalog. The plan step
      # below fails when the copies under .config/archetypes/ do not match the lock.
      - name: Verify the lock against the pinned praetor catalog
        run: praetorctl plan --catalog-root praetor-src

      # plan passes without .standards.lock: it then resolves built-in defaults and reports
      # the missing lock as drift without failing. sync fails on a missing lock, and it
      # fails when .github/rulesets/main.json differs from the policy .standards.yaml
      # declares. It runs locally, without --remote, and only writes .config/labels.yaml into
      # this workspace.
      - name: Verify the lock exists and the committed ruleset matches the policy
        run: praetorctl sync --catalog-root praetor-src

      # The praetor checkout is a build and verification input only; nothing after this
      # step may read it as nucleus content.
      - name: Remove the praetor source
        run: rm -rf praetor-src

      - name: Verify the vendored catalog against the lock and resolve the policy
        run: praetorctl plan

      - name: Verify the compiled agent context
        run: praetorctl compile-context --verify
