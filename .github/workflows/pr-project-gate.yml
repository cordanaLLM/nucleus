---
name: pr-project-gate
on:
  pull_request:
    types: [opened, reopened, edited, labeled, unlabeled, synchronize, milestoned, ready_for_review]
  # The ruleset requires this check, and the default branch's head must carry it too: on a push
  # to main the gate checks the pull request that landed the commit, and refuses a commit that
  # no merged pull request landed.
  push:
    branches: [main]

# A newer push to the same pull request supersedes this run. Every other event gets a group
# of its own (run_id), so a run for main, a schedule or a dispatch is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-metadata:
    name: Validate PR Milestone & Metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the pull request that landed the pushed commit
        id: merged
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pulls="$(mktemp)"
          if ! gh api "repos/${REPO}/commits/${SHA}/pulls" > "${pulls}"; then
            echo "::error::Could not list the pull requests of ${SHA}."
            exit 1
          fi
          landed="$(jq -c --arg sha "${SHA}" '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)]' "${pulls}")"
          if [[ "$(jq 'length' <<< "${landed}")" != "1" ]]; then
            echo "::error::No merged pull request landed ${SHA} on main; commits reach main only through a pull request."
            exit 1
          fi
          pr="$(jq -c '.[0]' <<< "${landed}")"
          delim="EOF_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "number=$(jq -r '.number' <<< "${pr}")"
            echo "milestone=$(jq -r '.milestone.title // ""' <<< "${pr}")"
            echo "labels=$(jq -c '[.labels[].name]' <<< "${pr}")"
            echo "author=$(jq -r '.user.login' <<< "${pr}")"
            echo "head_ref=$(jq -r '.head.ref' <<< "${pr}")"
            echo "title<<${delim}"
            jq -r '.title' <<< "${pr}"
            echo "${delim}"
            echo "body<<${delim}"
            jq -r '.body // ""' <<< "${pr}"
            echo "${delim}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify PR Milestone, Issue Reference and Labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || steps.merged.outputs.number }}
          PR_TITLE: ${{ github.event.pull_request.title || steps.merged.outputs.title }}
          PR_BODY: ${{ github.event.pull_request.body || steps.merged.outputs.body }}
          PR_MILESTONE: ${{ github.event.pull_request.milestone.title || steps.merged.outputs.milestone }}
          PR_LABELS: ${{ github.event_name == 'push' && steps.merged.outputs.labels || toJson(github.event.pull_request.labels.*.name) }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || steps.merged.outputs.author }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || steps.merged.outputs.head_ref }}
        run: |
          set -euo pipefail
          echo "==> Validating PR metadata against governance hard gates..."

          # 0. Skip markers.
          # A squash merge turns the title and body into the commit message on main, and
          # GitHub skips every push workflow when that message carries one of its skip
          # markers. Refuse them here, before the release waiver, so no merge can land on
          # main without verification (issue #39).
          COMBINED="${PR_TITLE}"$'\n'"${PR_BODY}"
          if printf '%s\n' "${COMBINED}" | grep -Eqi '\[(skip ci|ci skip|no ci|skip actions|actions skip)\]|^skip-checks:[[:space:]]*true'; then
            echo "::error::The title or body contains a GitHub skip marker. The squash commit on main would run no workflow; reword it (for example, describe the marker without its brackets)."
            exit 1
          fi

          # 0b. Release automation waiver.
          # release-please authors its release pull request from a generated changelog.
          # It has no milestone (the API gives it no way to set one), no issue to
          # reference, and carries only the "autorelease: pending" label, so all three
          # gates below are unsatisfiable for it and the repository's own release train
          # would never merge. Waive them only when the author is the Actions bot AND
          # the branch is one release-please owns: a label alone is not enough, because
          # any contributor can apply a label to their own pull request.
          if [[ "${PR_AUTHOR}" == "github-actions[bot]" && "${PR_HEAD_REF}" == release-please--branches--* ]]; then
            echo "==> Release automation pull request: ${PR_AUTHOR} on ${PR_HEAD_REF}."
            echo "==> Metadata gates waived. Code gates (ci, codeql, security-scans) still apply."
            exit 0
          fi

          # 0c. Dependency update waiver.
          # Renovate opens its update pull requests from a template: no milestone, no
          # issue it fixes, and only the "dependencies" label. Waive the three gates only
          # when the author is the Renovate app's bot account AND the branch is one
          # Renovate owns. GitHub reserves the "[bot]" suffix for apps, so no person can
          # take that login; the branch prefix alone is not enough, since anyone with
          # push access can name a branch renovate/*.
          if [[ "${PR_AUTHOR}" == "renovate[bot]" && "${PR_HEAD_REF}" == renovate/* ]]; then
            echo "==> Dependency update pull request: ${PR_AUTHOR} on ${PR_HEAD_REF}."
            echo "==> Metadata gates waived. Code gates (ci, codeql, security-scans) still apply."
            exit 0
          fi

          # 1. Milestone Check (with live query fallback if event payload lagged)
          if [[ -z "${PR_MILESTONE}" || "${PR_MILESTONE}" == "null" ]]; then
            PR_MILESTONE="$(gh pr view "${PR_NUMBER}" --json milestone --jq .milestone.title)"
          fi

          if [[ -z "${PR_MILESTONE}" || "${PR_MILESTONE}" == "null" ]]; then
            echo "::error::PR is missing an assigned milestone! PRs must be assigned to an active milestone."
            exit 1
          fi

          # 2. Issue/Epic Reference Check
          if ! echo "${COMBINED}" | grep -Eqi '(fixes|closes|resolves|relates to|ref)[[:space:]]+(#[0-9]+|[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+#[0-9]+|EPIC-[0-9]+)'; then
            echo "::error::PR description must reference a tracked Issue or Epic (e.g. 'Fixes #123' or 'Relates to EPIC-01')."
            exit 1
          fi

          # 3. Label Check (with live query fallback)
          HAS_VALID_LABEL=false
          if echo "${PR_LABELS}" | grep -Eq '"(tier/[^"]+|area/[^"]+)"'; then
            HAS_VALID_LABEL=true
          else
            LIVE_LABELS="$(gh pr view "${PR_NUMBER}" --json labels --jq '[.labels[].name] | @json')"
            if echo "${LIVE_LABELS}" | grep -Eq '"(tier/[^"]+|area/[^"]+)"'; then
              HAS_VALID_LABEL=true
            fi
          fi

          if [[ "${HAS_VALID_LABEL}" != "true" ]]; then
            echo "::error::PR must carry at least one 'tier/*' or 'area/*' label."
            exit 1
          fi

          echo "==> PR hard gate validation passed successfully."
