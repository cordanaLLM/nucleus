---
# Verifies the kernel requirement documents downstream consumers publish against the kconfig
# this forge declares for the streams each consumer is bound to. Sources and bindings are
# declared in versions.json downstream.requirements; the policy is docs/adr/0007.
#
# Two evidence levels, one job each (docs/adr/0008):
# verify           declared: the fragments as scripts/merge-config.sh merges them.
# resolve          per bound stream, the signed source is fetched and verified, and the
#                  fragments are resolved against it (defconfig, merge_config.sh, olddefconfig,
#                  survival check) for every architecture a document lists. Nothing compiles.
# verify-resolved  resolved: the documents against those .config files.
#
# repository_dispatch  a consumer sends kernel_requirements_updated with the commit, sha256
#                      and correlation id of the document it validated; that exact document
#                      is fetched, and its digest and correlation id proven before use.
# schedule             documents that are not dispatched are re-read weekly.
# pull_request / push  a change to the fragments, the scripts or the bindings is checked
#                      before it can drift.
name: verify-requirements
on:
  repository_dispatch:
    types: [kernel_requirements_updated]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
  pull_request:
    paths:
      - "kconfig/**"
      - "keys/**"
      - "scripts/merge-config.sh"
      - "scripts/fetch-kernel-requirements.sh"
      - "scripts/fetch-kernel-source.sh"
      - "scripts/kconfig_survival.py"
      - "scripts/versions_query.py"
      - "scripts/verify_kernel_requirement.py"
      - "tests/test_verify_kernel_requirement.py"
      - "tests/test_fetch_kernel_requirements.py"
      - "tests/test_fetch_kernel_source.py"
      - "tests/test_kconfig_survival.py"
      - "tests/fixtures/kernel-requirement/**"
      - "versions.json"
      - "versions.schema.json"
      - ".github/workflows/verify-requirements.yml"
  push:
    branches: [main]
    paths:
      - "kconfig/**"
      - "keys/**"
      - "scripts/merge-config.sh"
      - "scripts/fetch-kernel-requirements.sh"
      - "scripts/fetch-kernel-source.sh"
      - "scripts/kconfig_survival.py"
      - "scripts/versions_query.py"
      - "scripts/verify_kernel_requirement.py"
      - "tests/test_verify_kernel_requirement.py"
      - "tests/test_fetch_kernel_requirements.py"
      - "tests/test_fetch_kernel_source.py"
      - "tests/test_kconfig_survival.py"
      - "tests/fixtures/kernel-requirement/**"
      - "versions.json"
      - "versions.schema.json"
      - ".github/workflows/verify-requirements.yml"

permissions:
  contents: read

# A concurrency group holds at most one pending run, and a newer one cancels it. Each
# repository_dispatch run verifies one pinned commit, so it gets a group of its own and is
# never cancelled by a later dispatch or by a push or schedule run on the same ref.
concurrency:
  group: >-
    verify-requirements-${{ github.event_name == 'repository_dispatch'
    && format('dispatch-{0}', github.run_id) || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Downstream Kernel Requirements
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # An explicit bash runs as bash --noprofile --norc -eo pipefail, so a failing verifier
    # fails its step even though its output is piped through tee.
    defaults:
      run:
        shell: bash
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      resolve: ${{ steps.plan.outputs.resolve }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install Test Dependencies
        run: |
          set -euo pipefail
          pip install --no-cache-dir jsonschema pytest

      # The verifier's own tests, including parity with scripts/merge-config.sh, run before
      # its verdict is trusted. The full suite runs in ci.yml on every pull request.
      - name: Test the Verifier
        run: |
          set -euo pipefail
          pytest tests/test_verify_kernel_requirement.py tests/test_fetch_kernel_requirements.py \
            tests/test_kconfig_survival.py tests/test_fetch_kernel_source.py -v

      # Every client_payload field arrives from another repository, so each is passed through
      # env and validated by the script; none is interpolated into a run: block.
      - name: Fetch Requirement Documents
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_SOURCE: ${{ github.event.client_payload.source }}
          PAYLOAD_SCHEMA: ${{ github.event.client_payload.schema }}
          PAYLOAD_PATH: ${{ github.event.client_payload.requirement.path }}
          PAYLOAD_REF: ${{ github.event.client_payload.requirement.ref }}
          PAYLOAD_SHA256: ${{ github.event.client_payload.requirement.sha256 }}
          PAYLOAD_CORRELATION_ID: ${{ github.event.client_payload.correlation_id }}
        run: |
          set -euo pipefail
          ./scripts/fetch-kernel-requirements.sh --out=requirements

      - name: Verify Requirements Against the Declared KConfig
        env:
          NUCLEUS_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t args < requirements/args
          python3 scripts/verify_kernel_requirement.py "${args[@]}" \
            --nucleus-revision="${NUCLEUS_REVISION}" \
            --report-json=requirements/report.json | tee requirements/report.txt

      # The stream and architecture pairs the resolved level needs: every bound stream, on every
      # architecture a document lists. The plan is computed from versions.json and documents
      # that decoded; the resolve job still passes it to its scripts through env only.
      - name: Plan the Resolved Evidence
        id: plan
        run: |
          set -euo pipefail
          mapfile -t args < requirements/args
          python3 scripts/verify_kernel_requirement.py "${args[@]}" --plan=requirements/plan.json
          plan="$(cat requirements/plan.json)"
          echo "plan=${plan}" >> "${GITHUB_OUTPUT}"
          if [[ "${plan}" == '{"include":[]}' ]]; then
            echo "resolve=false" >> "${GITHUB_OUTPUT}"
          else
            echo "resolve=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Keep the Requirement Documents
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: kernel-requirement-documents
          path: requirements/
          if-no-files-found: error
          retention-days: 7

      - name: Publish Verification Report
        if: always()
        run: |
          set -euo pipefail
          if [[ -f requirements/report.txt ]]; then
            {
              echo '### Downstream kernel requirements'
              echo '```'
              cat requirements/report.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload Verification Report
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: kernel-requirement-report
          path: |
            requirements/report.json
            requirements/report.txt
          if-no-files-found: ignore
          retention-days: 30

  resolve:
    name: Resolve KConfig (${{ matrix.stream }})
    needs: verify
    if: needs.verify.outputs.resolve == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ubuntu:26.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.plan) }}
    steps:
      # pahole (dwarves) is required: DEBUG_INFO_BTF depends on it, and SCHED_CLASS_EXT on BTF.
      # The cross compilers resolve arm64 and riscv64 against the compiler that builds them.
      - name: Install the Resolution Toolchain
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            bash ca-certificates curl git gpg gpgv xz-utils python3 make gcc libc6-dev \
            flex bison bc dwarves gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Fetch and Verify the Kernel Source
        shell: bash
        env:
          STREAM: ${{ matrix.stream }}
        run: |
          set -euo pipefail
          ./scripts/fetch-kernel-source.sh --stream="${STREAM}" --dest="${RUNNER_TEMP}/linux-${STREAM}"

      - name: Resolve the Configuration
        shell: bash
        env:
          STREAM: ${{ matrix.stream }}
          ARCHES: ${{ matrix.arches }}
        run: |
          set -euo pipefail
          read -r -a arches <<< "${ARCHES}"
          for arch in "${arches[@]}"; do
            ./scripts/merge-config.sh --arch="${arch}" --stream="${STREAM}" \
              --source-tree="${RUNNER_TEMP}/linux-${STREAM}" \
              --build-dir="${RUNNER_TEMP}/kbuild-${STREAM}-${arch}"
          done

      - name: Upload the Resolved Configuration
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: resolved-config-${{ matrix.stream }}
          path: output/kernel-*.config
          if-no-files-found: error
          retention-days: 30

  verify-resolved:
    name: Verify Requirements Against the Resolved KConfig
    needs: [verify, resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Download the Requirement Documents
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kernel-requirement-documents
          path: requirements

      - name: Download the Resolved Configurations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: resolved-config-*
          merge-multiple: true
          path: output

      # A resolved file is output/kernel-<stream>-<arch>.config; an architecture name carries
      # no dash, so the last dash separates the two.
      - name: Verify Requirements Against the Resolved KConfig
        env:
          NUCLEUS_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t args < requirements/args
          resolved=()
          for config in output/kernel-*.config; do
            name="${config#output/kernel-}"
            name="${name%.config}"
            resolved+=("--resolved-config=${name%-*}:${name##*-}=${config}")
          done
          python3 scripts/verify_kernel_requirement.py "${args[@]}" "${resolved[@]}" \
            --nucleus-revision="${NUCLEUS_REVISION}" \
            --report-json=requirements/report-resolved.json | tee requirements/report-resolved.txt

      - name: Publish Verification Report
        if: always()
        run: |
          set -euo pipefail
          if [[ -f requirements/report-resolved.txt ]]; then
            {
              echo '### Downstream kernel requirements, resolved'
              echo '```'
              cat requirements/report-resolved.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload Verification Report
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: kernel-requirement-report-resolved
          path: |
            requirements/report-resolved.json
            requirements/report-resolved.txt
            output/kernel-*.config
          if-no-files-found: ignore
          retention-days: 30
