---
# Single required status check for branch protection.
# Protects main on THIS job only. It waits for every other check run on the commit and fails
# unless each one succeeded (scripts/required_checks_gate.py). A skipped check counts only
# when it is named with --allow-skip: Semgrep and Trivy, which the change detector in
# security-scans.yml may exclude, and whose skip the required Security Scan Gate judges.
# Branch protection: require the "required-checks" status check.

name: required-aggregator
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: read

jobs:
  required-checks:
    name: required-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require every other check run to succeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 scripts/required_checks_gate.py --repo "${REPO}" --ref "${REF}"
          --self required-checks --interval 20 --timeout 1500
          --allow-skip "Semgrep SAST" --allow-skip "Trivy Filesystem CVE Scan"
