---
# Single required status check for branch protection.
# Protects main on THIS job only. It waits for every other check run on the commit, including
# jobs that register late and runs whose forge status went stale, and fails unless each one
# succeeded (scripts/required_checks_gate.py). A skipped check counts only
# when it is named with --allow-skip: Semgrep and Trivy, which the change detector in
# security-scans.yml may exclude, and whose skip the required Security Scan Gate judges; and
# verify-tool-release, which release-please.yml runs only on the push that creates a release
# (or on a dispatch naming a tag), so every other push to main skips it. A failure of any of
# them still fails this gate.
# The wait covers build-matrix.yml on a pull request that touches the build path: measured
# spans reach 13397 s (run 39626121442), where queue under shared runners dominates.
# 19800 s (330 min) gives ~1.48x headroom over the worst measured span, and the job bound of
# 340 min stays under the 6 h hosted limit.
# Branch protection: require the "required-checks" status check.

name: required-aggregator
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A newer push to the same pull request supersedes this run. Every other event gets a group
# of its own (run_id), so a run for main, a schedule or a dispatch is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read

jobs:
  required-checks:
    name: required-checks
    runs-on: ubuntu-24.04
    # The gate's own --timeout plus ten minutes for the checkout and the last poll.
    timeout-minutes: 340
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every other check run to succeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 scripts/required_checks_gate.py --repo "${REPO}" --ref "${REF}"
          --self required-checks --interval 20 --timeout 19800
          --allow-skip "Semgrep SAST" --allow-skip "Trivy Filesystem CVE Scan"
          --allow-skip "verify-tool-release"
