---
# Event-driven required status check for branch protection.
#
# Why: the organisation runs on the free plan's single shared hosted-runner pool. On 2026-10-22 at
# 03:56Z, five nucleus required-aggregator jobs had been polling in progress since 00:56Z while 32
# nucleus build-matrix jobs sat queued; the pollers held runners the builds could have used.
#
# How: .standards.yaml declares "required-checks" under overrides.branch_protection.status_contexts,
# and .github/rulesets/main.json requires it with no integration pin,
# so a commit status named "required-checks" satisfies it. GitHub's check_suite and check_run
# workflow triggers do not fire for suites created by GitHub Actions
# (events-that-trigger-workflows.md), so this workflow is driven by push to main,
# workflow_run (types: [completed], running on the default branch with statuses: write for every
# other workflow except workflow_call-only release-build, up to three chained levels),
# and a 10-minute schedule sweep (--only-if-pending) for the deadline bound and
# any non-Actions checks. workflow_run always runs the default branch's copy.
#
# Bootstrap: the pull_request trigger and the required-checks polling job stay until the follow-up
# pull request drops them. workflow_run and schedule run the default branch's copy only, so the
# one-shot evaluator cannot post the status for a pull request before it is on main; the poller
# lands this file, and the follow-up lands on the status this file posts. The poller runs only on
# pull_request with checks: read; the evaluator never runs on pull_request.
#
# Bound: 19800 s (330 min) covers the measured pull request build-matrix spans in
# tests/data/required-checks-spans.json (up to 13397 s on run 39626121442, ~1.48x headroom)
# without holding a runner while builds are queued or running.
#
# Self-exclusion: scripts/required_checks_gate.py --once ignores this workflow's own runs
# (--exclude-workflow .github/workflows/required-aggregator.yml) and its check-run names
# (--ignore-check "Evaluate required checks" and legacy --ignore-check required-checks).
# Skipped checks pass only when named with --allow-skip (Semgrep SAST, Trivy Filesystem CVE Scan,
# verify-tool-release).

name: required-aggregator
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_run:
    workflows:
      - build-matrix
      - ci
      - codeql
      - licence
      - nvidia-open-module
      - openzfs-module
      - package-lifecycle
      - pages
      - pr-project-gate
      - Praetor Documentation Governance
      - publish-release
      - release-please
      - scorecard
      - security-scans
      - supply-chain
      - verify-requirements
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"

# A newer push to a pull request supersedes its poller; evaluations are queued per SHA and never
# cancelled.
concurrency:
  group: >-
    required-checks-${{ (github.event_name == 'pull_request' && github.head_ref) ||
    github.event.workflow_run.head_sha ||
    (github.event_name == 'schedule' && github.run_id) ||
    github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate required checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
      actions: read
      statuses: write
      pull-requests: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pick commits
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shas_file="${RUNNER_TEMP}/target-shas.txt"
          : > "${shas_file}"
          case "${EVENT_NAME}" in
            workflow_run)
              printf '%s\n' "${WORKFLOW_RUN_HEAD_SHA}" > "${shas_file}"
              ;;
            schedule)
              mapfile -t open_shas < <(
                gh pr list --repo "${REPO}" --state open --limit 99 \
                  --json headRefOid,isDraft \
                  --jq '.[] | select(.isDraft | not) | .headRefOid'
              )
              open_shas+=("${HEAD_SHA}")
              count=0
              for sha in "${open_shas[@]}"; do
                if [[ -z "${sha}" ]]; then
                  continue
                fi
                printf '%s\n' "${sha}" >> "${shas_file}"
                count=$((count + 1))
                if [[ "${count}" -ge 100 ]]; then
                  break
                fi
              done
              ;;
            push)
              printf '%s\n' "${HEAD_SHA}" > "${shas_file}"
              ;;
            *)
              echo "::error::Unsupported event ${EVENT_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Post the required-checks status
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          shas_file="${RUNNER_TEMP}/target-shas.txt"
          mapfile -t shas < "${shas_file}"
          extra_args=()
          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            extra_args+=(--only-if-pending)
          fi
          overall_rc=0
          count=0
          for sha in "${shas[@]}"; do
            if [[ -z "${sha}" ]]; then
              continue
            fi
            count=$((count + 1))
            if [[ "${count}" -gt 100 ]]; then
              break
            fi
            rc=0
            python3 scripts/required_checks_gate.py \
              --once \
              --post-status \
              --repo "${REPO}" \
              --ref "${sha}" \
              --self required-checks \
              --bound 19800 \
              --exclude-workflow .github/workflows/required-aggregator.yml \
              --ignore-check "Evaluate required checks" \
              --ignore-check required-checks \
              --allow-skip "Semgrep SAST" \
              --allow-skip "Trivy Filesystem CVE Scan" \
              --allow-skip "verify-tool-release" \
              --target-url "${TARGET_URL}" \
              "${extra_args[@]}" || rc=$?
            if [[ "${rc}" -ne 0 ]]; then
              overall_rc="${rc}"
            fi
          done
          exit "${overall_rc}"

  # Bootstrap poller: waits for every other check run on the pull request head. The evaluate job
  # reports skipped on a pull_request run, so the poller allows that one skip by name.
  required-checks:
    name: required-checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
    # The gate's own --timeout plus ten minutes for the checkout and the last poll.
    timeout-minutes: 340
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every other check run to succeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 scripts/required_checks_gate.py --repo "${REPO}" --ref "${REF}"
          --self required-checks --interval 20 --timeout 19800
          --allow-skip "Semgrep SAST" --allow-skip "Trivy Filesystem CVE Scan"
          --allow-skip "verify-tool-release"
          --allow-skip "Evaluate required checks"
