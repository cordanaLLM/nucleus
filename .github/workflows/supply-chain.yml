---
name: supply-chain
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    name: SLSA Provenance & Cosign Attestation
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0

      - name: Generate SBOM and Sign Release Artifacts
        run: |
          set -euo pipefail
          # This job builds nothing: it attests only packages placed in output/ before it
          # runs, and fails when there are none. It never creates a package itself.
          shopt -s nullglob
          debs=(output/*.deb)
          if [[ "${#debs[@]}" -eq 0 ]]; then
            echo "::error title=Nothing to attest::no Debian package in output/; this job attests only packages it is given" >&2
            exit 1
          fi
          for deb in "${debs[@]}"; do
            if [[ ! -s "${deb}" ]]; then
              echo "::error title=Empty package::${deb} is empty; a zero-byte package is never attested" >&2
              exit 1
            fi
          done

          echo "==> Generating Syft CycloneDX and SPDX SBOMs..."
          syft dir:output/ -o cyclonedx-json=output/kernel-sbom.cdx.json
          syft dir:output/ -o spdx-json=output/kernel-sbom.spdx.json

          echo "==> Generating SHA256SUMS (refuses empty, unknown and missing files)..."
          OUTPUT_DIR=output scripts/publish_release.sh "${GITHUB_REF_NAME}"

          echo "==> Signing SHA256SUMS with keyless Cosign..."
          cosign sign-blob --yes --bundle output/SHA256SUMS.bundle output/SHA256SUMS
          echo "==> Supply chain attestation and SBOM generation complete."

      - name: Upload Supply Chain Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: supply-chain-attestations
          path: |
            output/*.cdx.json
            output/*.spdx.json
            output/SHA256SUMS*
