---
name: supply-chain
# Verifies a published kernel release the way a consumer does. publish-release.yml builds,
# signs and publishes; this workflow only reads. It runs after every publish-release run that
# succeeded, and on dispatch for any kernel release tag. It cannot run on the release event:
# publish-release.yml creates the release with GITHUB_TOKEN, and GitHub starts no workflow on
# an event GITHUB_TOKEN raised.
on:
  workflow_run:
    workflows: [publish-release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Kernel release tag v<version>-<stream>-lusoris<N> to verify"
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Published Release
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # One step, so the tag is checked by the verifier's pattern before anything else reads it.
      - name: Download and Verify the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          [[ "${TAG}" =~ ^v[0-9][0-9A-Za-z.~-]*-[a-z]+-lusoris[1-9][0-9]{0,3}$ ]] \
            || { echo "::error title=Not a kernel release tag::${TAG}" >&2; exit 1; }
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${RUNNER_TEMP}/release"
          scripts/verify-release.sh "${RUNNER_TEMP}/release" "${TAG}" "${GITHUB_REPOSITORY}"
