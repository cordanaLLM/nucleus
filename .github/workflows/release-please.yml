---
name: release-please
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Repository release tag to verify (e.g. nucleus-v0.4.0)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Mark Tool Release as Not Latest
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release edit "${TAG_NAME}" --repo "${REPO}" --latest=false

  verify-tool-release:
    needs: release-please
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    if: needs.release-please.outputs.release_created == 'true' || inputs.tag != ''
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Tool Release
        env:
          TAG_INPUT: ${{ inputs.tag }}
          TAG_CREATED: ${{ needs.release-please.outputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${TAG_INPUT:-${TAG_CREATED:-}}"
          if [ -z "$TAG" ]; then
            echo "verify-tool-release: no tag specified" >&2
            exit 1
          fi
          git fetch --tags origin
          gh release view "$TAG" --repo "$REPO" --json tagName,isDraft,isPrerelease,targetCommitish,assets > "$RUNNER_TEMP/release.json"
          python3 scripts/check_tool_release.py --tag "$TAG" --release-json "$RUNNER_TEMP/release.json"
