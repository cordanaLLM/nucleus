---
name: release-please
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Repository release tag to verify (e.g. nucleus-v0.4.0)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  # The job acts through the plurano-release GitHub App, not GITHUB_TOKEN: GitHub holds the
  # runs of a pull request that GITHUB_TOKEN opens or updates for approval, so every release
  # pull request waited for a hand approval. There is no fallback to GITHUB_TOKEN: without
  # the app's client id and key the job stops at its first step and says so. That step sees
  # only whether each is set, never the key.
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Require the Release App Credentials
        env:
          CLIENT_ID_SET: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
          PRIVATE_KEY_SET: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [[ "${CLIENT_ID_SET}" != "true" || "${PRIVATE_KEY_SET}" != "true" ]]; then
            message="RELEASE_APP_CLIENT_ID (variable) and RELEASE_APP_PRIVATE_KEY (secret) must both be set;"
            message+=" release-please acts through the plurano-release app and never through GITHUB_TOKEN."
            echo "::error title=Missing release app credentials::${message}" >&2
            exit 1
          fi

      - name: Create Release App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Run Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Mark Tool Release as Not Latest
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release edit "${TAG_NAME}" --repo "${REPO}" --latest=false

  verify-tool-release:
    needs: release-please
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    if: needs.release-please.outputs.release_created == 'true' || inputs.tag != ''
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Tool Release
        env:
          TAG_INPUT: ${{ inputs.tag }}
          TAG_CREATED: ${{ needs.release-please.outputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${TAG_INPUT:-${TAG_CREATED:-}}"
          if [ -z "$TAG" ]; then
            echo "verify-tool-release: no tag specified" >&2
            exit 1
          fi
          git fetch --tags origin
          gh release view "$TAG" --repo "$REPO" --json tagName,isDraft,isPrerelease,targetCommitish,assets > "$RUNNER_TEMP/release.json"
          python3 scripts/check_tool_release.py --tag "$TAG" --release-json "$RUNNER_TEMP/release.json"
