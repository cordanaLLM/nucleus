[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nucleus"
requires-python = ">=3.12"
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-v"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "setup.py",
    ".pytest_cache/*",
    "output/*",
    "build/*",
    "dist/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "output",
    "dist",
    "build",
]

# The lefthook scripts run under the interpreter .config/lefthook/python.sh finds, which accepts
# Python 3.10 (its floor), so they keep the branches 3.10 and 3.11 need.
[tool.ruff.per-file-target-version]
".config/lefthook/scripts/*.py" = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
]


