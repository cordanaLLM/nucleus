[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nucleus"
requires-python = ">=3.12"
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-v"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "setup.py",
    ".pytest_cache/*",
    "output/*",
    "build/*",
    "dist/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "output",
    "dist",
    "build",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
]

# Engine-owned files that adoption installs from praetor's verified bundle; editing them breaks
# the checkpoint evaluator check. One entry per file and rule in .config/lint-exceptions.yaml,
# which tests/test_lint_exceptions.py holds this table and the format exclude below to.
[tool.ruff.lint.per-file-ignores]
".config/lefthook/scripts/checkpoint.py" = ["C420"]

[tool.ruff.format]
exclude = [
    ".config/agent/hooks/block_evasion.py",
    ".config/lefthook/scripts/checkpoint.py",
    ".config/lefthook/scripts/common.py",
]

[tool.codespell]
skip = ".git,output,*.deb,*.xz,.pytest_cache,*.zst,*.iso,*.patch"
ignore-words-list = "bbrv3,sched_ext,virtio,virtiofs,kspp,vmlinuz,initramfs,ukify,cgroup,cgroups,cgroupfs,containerd,resolute,nd,te,hart,kconfig,hindsight"
