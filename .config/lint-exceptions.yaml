    category: D
    entered: "2026-10-18"
    expires: "2027-02-15"
    reason: >-
      Minified bundle built by tools/figures (interfig with React); its short identifiers read as
      misspellings. The fix is a build that emits a source map codespell can read instead.
  - path: patches/bbr3/0013-add-bbrv3.patch
