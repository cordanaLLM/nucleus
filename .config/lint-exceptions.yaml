    category: D
    entered: "2026-10-18"
    expires: "2027-02-15"
    reason: >-
      Exported unchanged from the upstream BBR commit versions.json pins; its two misspellings (in the
      commit message and one comment) are upstream text; a local fix would diverge from the commit.
