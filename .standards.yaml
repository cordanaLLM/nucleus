---
version: 1
repository:
  owner: cordanaLLM
  name: nucleus
  visibility: public
  description: "Kernel forge: compiles, hardens, gates and signs Linux kernels (four streams, three architectures) as Debian packages for imago."
  homepage: "https://cordanallm.github.io/nucleus/"
  topics:
    - kernel
    - ebpf
    - sched-ext
    - bbrv3
    - kspp
    - debian-packages
    - cloud-images
    - arm64
    - x86-64
    - riscv64
    - preempt-rt
    - reproducible-builds
  # Declared so every checkout renders .github/rulesets/main.json for main, including
  # a clone whose origin HEAD names another branch.
  default_branch: main
profiles:
  - os-image
facets:
  - security:high
  - api:public-contract
  - docs:seo-portal
  - agent:sandboxed
# Overrides only increase strictness, except review_mode: single_maintainer, which lets the
# only maintainer merge while no second reviewer or review bot exists: the rendered ruleset
# then requires no approving review and no code-owner review. The facets keep their
# reviewer minimum of 2 declared, so restoring independent review restores that minimum.
# Restore independent review when a second maintainer or a review bot exists (nucleus#26).
# Owner-approved 2026-09-28.
overrides:
  branch_protection:
    review_mode: single_maintainer
    # Declared at its live value; the forge default is the stricter one.
    require_extra_approval_for_unattributed_changes: true
    # required-aggregator.yml posts "required-checks" as a commit status from push to main,
    # workflow_run and schedule events; job discovery cannot derive it.
    status_contexts:
      - required-checks
# licence.yml already runs the REUSE lint job the ruleset requires; the hosted reuse.yml
# would add a second job of that name, which the ruleset refuses as a duplicate context.
adoption:
  decline:
    - reuse-gate
register:
  sources:
    expected: 13
    sha256:
      sha256:25f491d6da25827a2808a10129bb738cf2bea1890a316051a1be30d6919c9dd7
    inputs:
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: operating_contract.*
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: invariants.*
exceptions:
  - rule: HISS-18
    path: .github/workflows/security-scans.yml
    reason: >-
      Category A, 90 days from 2026-10-15. Every job a pull request starts begins with the draft
      step; semgrep, trivy and security-gate need changes, which the check reports because it reads no always() and no
      required context. Closed by cordanaLLM/praetor#1368.
    expires: "2027-01-13"
  - rule: HISS-18
    path: .github/workflows/verify-requirements.yml
    reason: >-
      Category A, 90 days from 2026-10-15. Every job a pull request starts begins with the draft
      step; resolve and verify-resolved need verify, which the check reports because it reads no always() and no
      required context. Closed by cordanaLLM/praetor#1368.
    expires: "2027-01-13"
  - rule: HISS-18
    path: .github/workflows/build-matrix.yml
    reason: >-
      Category A, 90 days from 2026-10-17 (UTC). Every job a pull request starts begins with the draft
      step; openzfs-module and nvidia-open-module need build and plan-modules for their artifacts and matrices, which the check reports because it reads no always() and no required context;
      no job of this workflow is a required check. Closed by cordanaLLM/praetor#1368.
    expires: "2027-01-15"
  - rule: HISS-18
    path: .github/workflows/package-lifecycle.yml
    reason: >-
      Category A, 90 days from 2026-10-17 (UTC). Every job a pull request starts begins with the draft
      step; lifecycle needs plan for its matrix, which the check reports because it reads no always() and no required context;
      no job of this workflow is a required check. Closed by cordanaLLM/praetor#1368.
    expires: "2027-01-15"
  - rule: codespell
    path: tools/figures/player/player.js
    reason: >-
      Category D, 120 days from 2026-10-18, the same entry as .config/lint-exceptions.yaml (tool
      codespell). Minified bundle built by tools/figures (interfig with React); its short identifiers
      read as misspellings. The fix is a build that emits a source map codespell can read instead.
    category: D
    entered: "2026-10-18"
    expires: "2027-02-15"
